<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>More Phone Brands | SmartSwap.Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

<body data-page="sell">
  <div id="site-header"></div>

            <input type="text" placeholder="Search more mobile brands" aria-label="Search more phone brands" />
          </div>

          <div class="model-grid" style="grid-template-columns:repeat(3,minmax(160px,1fr));">
            <a class="model-card" href="brand/apple">
              <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=500&q=80" alt="Apple brand">
              <span>Apple</span>
            </a>

            </a>

            </a>
            <a class="model-card" href="brand/vivo">

            <a class="model-card" href="brand/oneplus">

            </a>
            <a class="model-card" href="brand/poco">

              <img src="https://images.unsplash.com/photo-1556656793-08538906a9f8?auto=format&fit=crop&w=500&q=80" alt="Motorola brand">

            </a>
            <a class="model-card" href="brand/oppo">
              <img src="https://images.unsplash.com/photo-1573148195906-32dffe7b9d38?auto=format&fit=crop&w=500&q=80" alt="OPPO brand">

            <a class="model-card" href="brand/nokia">
