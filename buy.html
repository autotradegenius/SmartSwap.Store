<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSwap.Store — Buy Refurbished Phones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="buy">

<div id="site-header"></div>

<main>
  <section class="section wrap">
    <div class="section-head">
      <div class="eyebrow">Buy refurbished</div>
      <h2 id="buyPageTitle">Certified phones, honestly graded</h2>
      <p>Every listing is graded Superb, Good, or Fair, tested on 45 checkpoints, and backed by a 30-day warranty.</p>
    </div>

    <div class="filter-row" id="buyFilters" hidden>
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="under-10k">Under ₹10,000</button>
      <button class="filter-chip" data-filter="10k-20k">₹10,000–₹20,000</button>
      <button class="filter-chip" data-filter="above-20k">Above ₹20,000</button>
      <button class="filter-chip" data-filter="iphone">iPhone</button>
      <button class="filter-chip" data-filter="android">Android</button>
    </div>

    <div class="brand-logo-grid buy-brand-picker" data-brand-picker="compact" aria-label="Phone brands"></div>

    <section class="flash-sale-section" aria-labelledby="flashSaleTitle">
      <div class="flash-sale-heading"><h3 id="flashSaleTitle">Flash Sale</h3><span id="flashSaleLabel">Featured phones</span></div>
      <div class="flash-sale-grid" id="flashSaleGrid"></div>
    </section>

    <div class="grid-4" id="buyGrid"></div>
    <section class="benefits-band" data-benefits></section>
  </section>
</main>

<div id="site-footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/firebase-data.js"></script>
<script src="js/main.js"></script>
<script src="js/brand-experience.js?v=20260905"></script>
<script src="js/buy-master-catalog.js"></script>
<script>
// ---------- phone icon svg (shared) ----------
const phoneSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>`;
window.swapioPhoneSVG = phoneSVG;

// ---------- buy grid ----------
const buyModels = [
  {id:'iphone-12',name:'iPhone 12', spec:'128GB · Apple', now:'₹32,999', was:'₹52,000', grade:'Superb', warranty:'30-day', image:'https://images.unsplash.com/photo-1591337676887-a217a6970a8a?auto=format&fit=crop&w=500&q=85'},
  {id:'galaxy-s21-fe',name:'Galaxy S21 FE', spec:'128GB · Samsung', now:'₹21,499', was:'₹34,000', grade:'Good', warranty:'30-day', status:'sold'},
  {id:'oneplus-9r',name:'OnePlus 9R', spec:'128GB · OnePlus', now:'₹17,999', was:'₹28,000', grade:'Superb', warranty:'30-day'},
  {id:'iphone-se-2022',name:'iPhone SE (2022)', spec:'64GB · Apple', now:'₹18,499', was:'₹29,000', grade:'Good', warranty:'30-day', status:'sold'},
  {id:'redmi-note-12',name:'Redmi Note 12', spec:'128GB · Xiaomi', now:'₹9,999', was:'₹15,500', grade:'Fair', warranty:'15-day', image:'https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=500&q=85'},
  {id:'pixel-7',name:'Pixel 7', spec:'128GB · Google', now:'₹29,999', was:'₹45,000', grade:'Superb', warranty:'30-day', image:'https://images.unsplash.com/photo-1605236453806-6ff36851218e?auto=format&fit=crop&w=500&q=85'},
  {id:'galaxy-a54',name:'Galaxy A54', spec:'128GB · Samsung', now:'₹15,999', was:'₹24,000', grade:'Good', warranty:'30-day'},
  {id:'iphone-13',name:'iPhone 13', spec:'128GB · Apple', now:'₹41,999', was:'₹62,000', grade:'Superb', warranty:'30-day', image:'https://images.unsplash.com/photo-1591337676887-a217a6970a8a?auto=format&fit=crop&w=500&q=85'},
];
const buyMasterModels = Array.isArray(window.BUY_MASTER_MODELS) ? window.BUY_MASTER_MODELS : [];
buyMasterModels.forEach(model => {
  if (!buyModels.some(existing => existing.id === model.id)) {
    buyModels.push({...model, now:`₹${Number(model.price).toLocaleString('en-IN')}`, was:model.oldPrice ? `₹${Number(model.oldPrice).toLocaleString('en-IN')}` : ''});
  }
});
const buyOverrides = JSON.parse(localStorage.getItem('swapioBuyModels') || '{}');
buyModels.forEach(model => {
  const override = buyOverrides[model.id] || {};
  Object.assign(model, override);
  if(override.price) model.now = `₹${Number(override.price).toLocaleString('en-IN')}`;
  if(override.oldPrice) model.was = `₹${Number(override.oldPrice).toLocaleString('en-IN')}`;
});
const catalogProducts = window.swapioData?.readProducts ? window.swapioData.readProducts() : JSON.parse(localStorage.getItem('swapioAdminProducts') || '[]');
function storageVariantSummary(product){
  if(Array.isArray(product.storageVariants) && product.storageVariants.length){
    return product.storageVariants.map(item => `${item.storage}: ₹${Number(item.price || 0).toLocaleString('en-IN')}`).join(' · ');
  }
  return product.details || `${product.brand} · Admin listing`;
}
const adminBuyModels = catalogProducts.filter(product => product.visible !== false)
  .map(product => ({
    name: product.name,
    brand: product.brand || '',
    spec: `${product.brand || ''}${product.brand && storageVariantSummary(product) ? ' · ' : ''}${storageVariantSummary(product)}`,
    now: `₹${Number(product.price).toLocaleString('en-IN')}`,
    was: '',
    grade: 'Superb',
    warranty: '30-day',
    image: product.photos?.[0] || ''
  }));
buyModels.push(...adminBuyModels);
const gradeClass = {Superb:'pill-green', Good:'pill-gold', Fair:'pill-coral'};
const buyGrid = document.getElementById('buyGrid');
const flashSaleGrid = document.getElementById('flashSaleGrid');

function renderBuyModels(models, target = buyGrid){
  target.innerHTML = models.length ? models.map(m=>`
  <div class="product-card">
    <div class="${m.image ? 'phone-image-stack' : 'phone-icon'}">${m.backImage ? `<img class="phone-back" src="${m.backImage}" alt="${m.name} back" loading="lazy">` : ''}${m.image ? `<img class="phone-front" src="${m.image}" alt="${m.name} front" loading="lazy" onerror="this.parentElement.innerHTML=window.swapioPhoneSVG">` : phoneSVG}</div>
    <h4>${m.name}</h4>
    <div class="spec">${m.spec}</div>
    <div class="badge-row">
      ${m.status === 'sold' ? '<span class="pill pill-coral">Sold</span>' : ''}
      <span class="pill ${gradeClass[m.grade]}">${m.grade}</span>
      <span class="pill pill-gold">${m.warranty} warranty</span>
    </div>
    <div class="price-row"><span class="now">${m.now}</span>${m.was ? `<span class="was">${m.was}</span>` : ''}</div>
    <button class="btn ${m.status === 'sold' ? 'btn-sold-out' : 'btn-coral'}" data-buy-model="${m.name}" data-buy-price="${m.now}" style="width:100%;" ${m.status === 'sold' ? 'disabled' : ''}>${m.status === 'sold' ? 'Sold out' : 'Buy Now'}</button>
  </div>`).join('') : '<p style="color:var(--slate);grid-column:1/-1;">No phones match this filter yet.</p>';
}

const brandFilter = new URLSearchParams(window.location.search).get('brand');
const showAllBrands = new URLSearchParams(window.location.search).get('brands') === 'all';
const showAllPhones = new URLSearchParams(window.location.search).get('all') === '1';
const visibleBuyModels = brandFilter
  ? buyModels.filter(model => `${model.brand || ''} ${model.name} ${model.spec}`.toLowerCase().includes(brandFilter.toLowerCase()))
  : buyModels;
const buyScopeSelected = Boolean(brandFilter || showAllPhones);
if (brandFilter) {
  const brandPicker = document.querySelector('.buy-brand-picker');
  const pageTitle = document.getElementById('buyPageTitle');
  if (brandPicker) brandPicker.hidden = true;
  if (pageTitle) pageTitle.textContent = `${brandFilter.charAt(0).toUpperCase()}${brandFilter.slice(1)} refurbished phones`;
  document.querySelectorAll('#buyFilters [data-filter="iphone"], #buyFilters [data-filter="android"]').forEach(button => { button.hidden = true; });
}
document.getElementById('buyFilters').hidden = !buyScopeSelected;
renderBuyModels((buyScopeSelected ? visibleBuyModels : buyModels).slice(0, 5), flashSaleGrid);
if (buyScopeSelected) renderBuyModels(visibleBuyModels);
else buyGrid.innerHTML = '';

document.body.insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="checkoutModal"><div class="modal-box checkout-box"><div class="modal-close" id="checkoutClose"><span aria-hidden="true">×</span></div><div id="checkoutEntry"><h3>Pay and complete your order</h3><p class="sub" id="checkoutProduct"></p><div class="upi-payment"><p>Scan this QR with any UPI app</p><img id="upiQr" alt="SmartSwap.Store UPI payment QR code"><strong id="upiIdLabel"></strong><a id="upiLink" class="btn btn-ghost" href="#">Pay in UPI app</a><small>After payment, enter the UTR / transaction ID below.</small></div><form id="checkoutForm" class="form-fields"><input name="name" placeholder="Your name" required><input name="phone" type="tel" placeholder="Phone number" required><textarea name="address" rows="3" placeholder="Delivery address" required></textarea><input name="utr" placeholder="UPI UTR / transaction ID" required><button class="btn btn-coral" type="submit">Submit paid order</button><div class="form-msg"></div></form></div><div id="checkoutSubmitted" class="checkout-submitted" hidden><h3>Payment submitted</h3><p id="checkoutSubmittedMessage"></p><strong id="checkoutTimer"></strong><small>We are checking your payment and will contact you shortly.</small></div></div></div>`);
const checkoutModal = document.getElementById('checkoutModal');
const checkoutForm = document.getElementById('checkoutForm');
const checkoutProduct = document.getElementById('checkoutProduct');
const checkoutEntry = document.getElementById('checkoutEntry');
const checkoutSubmitted = document.getElementById('checkoutSubmitted');
const checkoutSubmittedMessage = document.getElementById('checkoutSubmittedMessage');
const checkoutTimer = document.getElementById('checkoutTimer');
let selectedProduct = null;
let checkoutTimerId = null;
document.querySelectorAll('#buyGrid, #flashSaleGrid').forEach(grid => grid.addEventListener('click', event => {
  const button = event.target.closest('[data-buy-model]');
  if(!button) return;
  selectedProduct = {name:button.dataset.buyModel, price:button.dataset.buyPrice};
  checkoutEntry.hidden = false; checkoutSubmitted.hidden = true;
  checkoutProduct.textContent = `${selectedProduct.name} · ${selectedProduct.price}`;
  const amount = selectedProduct.price.replace(/[^0-9.]/g, '');
  const upiId = window.SWAPIO_UPI_ID || '';
  const upiUri = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=SmartSwap.Store&am=${encodeURIComponent(amount)}&cu=INR`;
  document.getElementById('upiQr').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUri)}`;
  document.getElementById('upiIdLabel').textContent = upiId;
  document.getElementById('upiLink').href = upiUri;
  checkoutModal.classList.add('open');
}));
document.getElementById('checkoutClose').addEventListener('click', () => checkoutModal.classList.remove('open'));
checkoutModal.addEventListener('click', event => { if(event.target === checkoutModal) checkoutModal.classList.remove('open'); });
checkoutForm.addEventListener('submit', async event => {
  event.preventDefault();
  if(!window.swapioAuth?.requireUser()) return;
  const data = Object.fromEntries(new FormData(checkoutForm).entries());
  data.type = 'order'; data.model = selectedProduct.name; data.price = selectedProduct.price; data.payment = 'UPI'; data.paymentStatus = 'Payment pending verification'; data.createdAt = Date.now();
  if(!window.swapioData?.saveCustomerSubmission) { checkoutSubmittedMessage.textContent = 'Firebase is not configured yet. Please try again later.'; return; }
  try {
    await window.swapioData.saveCustomerSubmission(data);
  } catch(error) {
    checkoutSubmittedMessage.textContent = error.message || 'The order could not be saved. Please try again.';
    return;
  }
  const orders = JSON.parse(localStorage.getItem('swapioOrders') || '[]');
  orders.unshift(data); localStorage.setItem('swapioOrders', JSON.stringify(orders));
  checkoutForm.reset();
  checkoutEntry.hidden = true; checkoutSubmitted.hidden = false;
  checkoutSubmittedMessage.textContent = 'Order submitted. Payment received for verification.';
  let remainingSeconds = 10 * 60;
  clearInterval(checkoutTimerId);
  const updateTimer = () => { const minutes = Math.floor(remainingSeconds / 60); const seconds = String(remainingSeconds % 60).padStart(2, '0'); checkoutTimer.textContent = `Confirmation update in ${minutes}:${seconds}`; if(remainingSeconds <= 0){ clearInterval(checkoutTimerId); checkoutTimer.textContent = 'Our team is reviewing your payment.'; } remainingSeconds--; };
  updateTimer(); checkoutTimerId = setInterval(updateTimer, 1000);
});

document.getElementById('buyFilters').addEventListener('click', (event) => {
  const filterButton = event.target.closest('[data-filter]');
  if(!filterButton) return;

  document.querySelectorAll('#buyFilters .filter-chip').forEach(button => button.classList.remove('active'));
  filterButton.classList.add('active');

  const filter = filterButton.dataset.filter;
  const scopedModels = brandFilter ? visibleBuyModels : buyModels;
  const filteredModels = scopedModels.filter(model => {
    const price = Number(model.now.replace(/[^0-9]/g, ''));
    const isIphone = model.name.toLowerCase().includes('iphone') || model.spec.includes('Apple');

    if(filter === 'under-10k') return price < 10000;
    if(filter === '10k-20k') return price >= 10000 && price <= 20000;
    if(filter === 'above-20k') return price > 20000;
    if(filter === 'iphone') return isIphone;
    if(filter === 'android') return !isIphone;
    return true;
  });

  renderBuyModels(filteredModels.slice(0, 5), flashSaleGrid);
  renderBuyModels(filteredModels);
  const flashSaleLabel = document.getElementById('flashSaleLabel');
  if (flashSaleLabel) flashSaleLabel.textContent = filter === 'all' ? 'Featured phones' : 'Filtered phones';
});
</script>
</body>
</html>
