<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sell Old Apple Mobile Phone | SmartSwap.Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="sell">
  <div id="site-header"></div>

  <main class="sell-flow-page">
    <section class="sell-flow-wrap wrap">
      <div class="sell-page-breadcrumb">Home &nbsp;&gt;&nbsp; Sell Old Mobile Phone &nbsp;&gt;&nbsp; Sell Old Apple</div>

      <div class="sell-main-panel" style="grid-template-columns:1fr;">
        <div class="sell-panel-left">
          <div class="sell-title-block">
            <h1>Sell Old Apple Mobile Phone</h1>
          </div>

          <div class="sell-search-box" style="max-width:100%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>
            <input type="text" placeholder="Select Model" aria-label="Select model" />
          </div>

          <div class="model-grid" style="grid-template-columns:repeat(3,minmax(160px,1fr));">
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?auto=format&fit=crop&w=500&q=80" alt="iPhone 6" />
              <span>Apple iPhone 6</span>
            </a>
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1573148195906-32dffe7b9d38?auto=format&fit=crop&w=500&q=80" alt="iPhone 6 Plus" />
              <span>Apple iPhone 6 Plus</span>
            </a>
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1580910051074-3eb7f5f0f6c6?auto=format&fit=crop&w=500&q=80" alt="iPhone 7" />
              <span>Apple iPhone 7</span>
            </a>
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=500&q=80" alt="iPhone 8" />
              <span>Apple iPhone 8</span>
            </a>
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80" alt="iPhone 11" />
              <span>Apple iPhone 11</span>
            </a>
            <a class="model-card" href="variant.html">
              <img src="https://images.unsplash.com/photo-1611472173362-3f53dbf3b1d6?auto=format&fit=crop&w=500&q=80" alt="iPhone 12" />
              <span>Apple iPhone 12</span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/firebase-data.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/main.js"></script>

</html>
