<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login to Sell Your Phone | SmartSwap.Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="sell">
  <div id="site-header"></div>

  <main class="sell-flow-page">
    <section class="sell-flow-wrap wrap">
      <div class="sell-page-breadcrumb">Home &nbsp;&gt;&nbsp; Login</div>

      <div class="sell-main-panel" style="grid-template-columns:1.2fr .9fr;">
        <div class="sell-panel-left" style="background:linear-gradient(180deg,#1ac0b1 0%,#1dc0ba 100%); border-radius:18px; min-height:520px; position:relative; overflow:hidden; padding:28px 28px 18px;">
          <div style="font-size:3rem; line-height:1; font-weight:700; letter-spacing:-.06em; color:#fff; font-family:var(--display);">Login/Signup</div>
          <p style="color:rgba(255,255,255,.75); margin-top:12px; font-size:0.95rem;">Sign in to get the best price for your old phone</p>
          <div style="position:absolute; left:50%; transform:translateX(-50%); bottom:32px; width:100%; max-width:220px; height:220px;">
            <div style="position:absolute; inset:0 0 0 0; background:rgba(255,255,255,.18); border-radius:50%; filter:blur(10px);"></div>
            <svg viewBox="0 0 220 220" style="position:relative; width:100%; height:100%;">
              <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M80 125l25 20 40-55" stroke-width="8"/>
                <circle cx="110" cy="70" r="28" fill="none" stroke="#fff" stroke-width="6"/>
                <path d="M70 145c8-35 38-55 75-55s64 20 75 55"/>
                <path d="M135 155l20 35"/>
                <path d="M85 155l-20 35"/>
              </g>
            </svg>
          </div>
        </div>

        <div class="sell-panel-right">
          <div style="text-align:center; padding:0 12px;">
            <div style="font-size:1.8rem; font-weight:700; color:#1a1d27; font-family:var(--display); margin-bottom:8px;">Sell for Best Price</div>
            <div style="font-size:0.9rem; color:#58707b; margin-bottom:32px;">Get verified and start selling</div>

            <div class="otp-form">
              <label style="text-align:left; display:block; font-size:0.85rem; font-weight:600; color:#1a1d27; margin-bottom:8px;">Enter your phone number</label>
              <div class="phone-input-row" style="gap:8px;">
                <span style="font-weight:600; color:#1a1d27;">+91</span>
                <input type="tel" placeholder="10 digit mobile number" style="flex:1; padding:10px 12px; border:1px solid #d0d8df; border-radius:8px; font-size:0.95rem;" />
              </div>
            </div>

            <label class="terms-row" style="margin:16px 0; font-size:0.85rem; text-align:left;">
              <input type="checkbox" checked />
              <span>I agree to the <a href="#" style="color:#1ac0b1; text-decoration:none;">Terms and Conditions</a> &amp; <a href="#" style="color:#1ac0b1; text-decoration:none;">Privacy Policy</a></span>
            </label>

            <button class="btn btn-coral btn-wide" onclick="window.location.href='step2-brand.html'" style="width:100%; margin-bottom:12px;">Continue →</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/firebase-data.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
