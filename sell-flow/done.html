<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSwap.Store — Sell Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=20260908mobile" />
</head>
<body data-page="sell">
  <div id="site-header"></div>

  <main class="sell-flow-page">
    <section class="sell-flow-wrap wrap">
      <div class="sell-main-panel" style="grid-template-columns:1fr; text-align:center; padding:48px 24px;">
        <div>
          <div style="font-size:3rem; font-weight:700; color:#1a1d27; font-family:var(--display); margin-bottom:12px;">Thanks!</div>
          <div id="doneMessage" style="font-size:1.3rem; color:#4a5763; margin-bottom:12px;">Your SmartSwap sell request is submitted successfully.</div>
          <div id="doneOffer" style="font-size:1.8rem; font-weight:700; color:#ff5d3a; margin-bottom:24px;" hidden></div>
          <div id="customerContactField" style="max-width:360px;margin:0 auto 18px;text-align:left;">
            <label for="customerPhone" style="display:block;margin-bottom:7px;font-weight:600;color:#1a1d27;">Your contact number</label>
            <div style="display:flex;align-items:center;border:1px solid #d0d8df;border-radius:8px;overflow:hidden;">
              <span style="padding:12px 10px;background:#f2f5f7;color:#4a5763;font-size:1rem;border-right:1px solid #d0d8df;">+91</span>
              <input id="customerPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="Enter your 10-digit number" style="flex:1;padding:12px;border:none;font-size:1rem;outline:none;">
            </div>
            <small id="customerPhoneError" style="display:block;color:#d94b35;margin-top:6px;" hidden>Please enter a valid 10-digit number.</small>
          </div>
          <button id="sellNowButton" class="btn btn-coral" type="button">Confirm and submit</button>
          <div id="doneSellSummary" class="sell-summary-panel" style="max-width:420px;margin:24px auto 0;text-align:left;"></div>
          <button id="doneHomeButton" class="btn btn-ghost" type="button" onclick="window.location.href='../index.html'">Back to Home</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/firebase-data.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const doneParams = new URLSearchParams(window.location.search);
    const isDamaged = doneParams.get('damaged') === '1';
    const brand = doneParams.get('brand') || '';
    const memory = doneParams.get('memory') || '';
    const offer = Number(doneParams.get('offer') || 0);
    const sellButton = document.getElementById('sellNowButton');
    const homeButton = document.getElementById('doneHomeButton');
    const contactField = document.getElementById('customerContactField');
    const phoneInput = document.getElementById('customerPhone');
    const phoneError = document.getElementById('customerPhoneError');
    const savedPhone = sessionStorage.getItem('smartSwapCustomerPhone') || '';
    let savedSellState = {};
    try { savedSellState = JSON.parse(sessionStorage.getItem('smartSwapSellState') || '{}'); } catch (error) { savedSellState = {}; }
    const summaryItems = [
      ['Phone', [savedSellState.brand, savedSellState.modelId, savedSellState.memory].filter(Boolean).join(' ')],
      ['Screen details', Object.values(savedSellState.screenDefectAnswers || {})],
      ['Body details', savedSellState.bodyDefect],
      ['Functional issues', (savedSellState.problemDetails || []).filter(item => item.answer === 'No').map(item => item.label)],
      ['Accessories included', (savedSellState.accessoryDetails || []).filter(item => item.answer === 'Yes').map(item => item.label)]
    ];
    document.getElementById('doneSellSummary').innerHTML = `<h3>SmartSwap Sell Summary</h3>${summaryItems.filter(([, values]) => Array.isArray(values) ? values.length : values).map(([title, values]) => `<section><h4>${title}</h4><ul>${(Array.isArray(values) ? values : [values]).map(value => `<li>${value}</li>`).join('')}</ul></section>`).join('')}`;
    if (/^\d{10}$/.test(savedPhone)) {
      contactField.hidden = true;
      phoneInput.value = savedPhone;
    }

    const offerEl = document.getElementById('doneOffer');
    if (isDamaged) {
      document.getElementById('doneMessage').textContent = `Confirm your damaged ${brand || 'phone'} ${memory} sale request.`;
      offerEl.textContent = `Estimated damaged-phone offer: ₹${offer.toLocaleString('en-IN')}`;
      offerEl.hidden = false;
      homeButton.hidden = true;
    } else {
      const normalOffer = Number(savedSellState.finalPrice || 0);
      if (normalOffer > 0) {
        offerEl.textContent = `Current offer: ₹${normalOffer.toLocaleString('en-IN')}`;
        offerEl.hidden = false;
      }
    }

    sellButton.addEventListener('click', async () => {
      const phone = (savedPhone || phoneInput.value).replace(/\D/g, '');
      if (!/^\d{10}$/.test(phone)) {
        phoneError.hidden = false;
        phoneInput.focus();
        return;
      }
      phoneError.hidden = true;
      sellButton.disabled = true;
      sellButton.textContent = 'Saving...';
      let sellState = {};
      try {
        sellState = JSON.parse(sessionStorage.getItem('smartSwapSellState') || '{}');
      } catch (error) {
        sellState = {};
      }
      const submission = isDamaged
        ? { type: 'damaged-phone', brand: brand || 'Phone', memory, offer, status: 'New' }
        : { type: 'sell', ...sellState, status: 'New' };
      submission.customerPhone = `+91${phone}`;
      submission.createdAt = Date.now();
      try {
        if (!window.swapioData?.saveCustomerSubmission) throw new Error('Submission service is unavailable.');
        const savedRequest = await window.swapioData.saveCustomerSubmission(submission);
        document.getElementById('doneMessage').textContent = `Request ${savedRequest.requestNumber} submitted successfully.`;
        sellButton.textContent = 'Request Submitted';
        sessionStorage.removeItem('smartSwapCustomerPhone');
      } catch (error) {
        console.error('Sell request queued for Firebase retry.', error);
        document.getElementById('doneMessage').textContent = `Request ${submission.requestNumber} is saved securely and will sync automatically.`;
        sellButton.disabled = false;
        sellButton.textContent = 'Request Saved';
      }
    });
    if (/^\d{10}$/.test(savedPhone)) {
      document.getElementById('doneMessage').textContent = 'Submitting your sell request...';
      setTimeout(() => sellButton.click(), 0);
    }
  </script>
</body>
</html>
