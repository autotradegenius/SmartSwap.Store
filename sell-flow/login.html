<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Your Exact Sell Value | SmartSwap.Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=20260908mobile" />
</head>
<body data-page="sell">
  <div id="site-header"></div>

  <main class="sell-flow-page">
    <section class="sell-flow-wrap wrap">
      <div class="sell-page-breadcrumb">Home &nbsp;&gt;&nbsp; Sell Old Mobile Phone &nbsp;&gt;&nbsp; Exact value</div>

      <div class="sell-main-panel" style="grid-template-columns:1.1fr .9fr;">
        <div class="sell-panel-left" style="background:linear-gradient(180deg,#1ac0b1 0%,#1fc0b9 100%);border-radius:18px;min-height:520px;position:relative;overflow:hidden;padding:28px 28px 18px;">
          <div style="font-size:3rem; line-height:1; font-weight:700; letter-spacing:-.06em; color:#fff; font-family:var(--display);">Exact value ready</div>
          <p style="color:rgba(255,255,255,.75); margin-top:12px; font-size:0.95rem;">No login required. Share your number to submit your sell request.</p>

          <div style="position:absolute; left:50%; transform:translateX(-50%); bottom:30px; width:100%; max-width:240px; height:220px; display:flex; align-items:center; justify-content:center;">
            <svg viewBox="0 0 220 220" style="width:100%; height:100%;">
              <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M80 125l25 20 40-55" stroke-width="8"/>
                <circle cx="110" cy="70" r="28" fill="none" stroke="#fff" stroke-width="6"/>
                <path d="M70 145c8-35 38-55 75-55s64 20 75 55"/>
                <path d="M135 155l20 35"/>
                <path d="M85 155l-20 35"/>
              </g>
            </svg>
          </div>
        </div>

        <div class="sell-panel-right">
          <div style="text-align:center; padding:0 12px;">
            <div style="font-size:1.8rem; font-weight:700; color:#1a1d27; font-family:var(--display); margin-bottom:8px;">Your exact sell value</div>
            <div style="font-size:0.9rem; color:#58707b; margin-bottom:32px;">Enter your mobile number to submit your request</div>

            <div class="login-price-box" style="margin-bottom:22px;">
              <div class="login-model" id="loginDeviceName">Phone</div>
              <div class="login-selling-price">Selling Price</div>
              <div class="login-price" id="loginPrice">₹0</div>
            </div>

            <div class="otp-form" style="margin-top:10px;">
              <label style="text-align:left; display:block; font-size:0.85rem; font-weight:600; color:#1a1d27; margin-bottom:8px;">Your mobile number</label>
              <div class="phone-input-row" style="gap:8px;">
                <span style="font-weight:600; color:#1a1d27;">+91</span>
                <input id="sellLoginPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" style="flex:1; padding:10px 12px; border:1px solid #d0d8df; border-radius:8px; font-size:0.95rem;" />
              </div>
              <small id="sellLoginPhoneError" style="display:block;color:#d94b35;margin-top:6px;text-align:left;" hidden>Please enter a valid 10-digit number.</small>
            </div>

            <label class="terms-row" style="margin:16px 0; font-size:0.85rem; text-align:left;">
              <input type="checkbox" checked />
              <span>I agree to the <a href="#" style="color:#1ac0b1; text-decoration:none;">Terms and Conditions</a> &amp; <a href="#" style="color:#1ac0b1; text-decoration:none;">Privacy Policy</a></span>
            </label>

            <button id="sellLoginContinue" class="btn btn-coral btn-wide" type="button" style="width:100%; margin-bottom:12px;">Submit sell request →</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/firebase-data.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/sell-flow.js?v=20260910sellsummary1"></script>
  <script>
    const loginParams = new URLSearchParams(window.location.search);
    const loginPhone = document.getElementById('sellLoginPhone');
    const loginPhoneError = document.getElementById('sellLoginPhoneError');
    const loginContinue = document.getElementById('sellLoginContinue');
    const savedPhone = sessionStorage.getItem('smartSwapCustomerPhone') || '';
    loginPhone.value = savedPhone;
    loginContinue.onclick = () => {
      const phone = loginPhone.value.replace(/\D/g, '');
      if (!/^\d{10}$/.test(phone)) {
        loginPhoneError.hidden = false;
        loginPhone.focus();
        return;
      }
      loginPhoneError.hidden = true;
      sessionStorage.setItem('smartSwapCustomerPhone', phone);
      window.location.href = 'done.html' + window.location.search;
    };
    if (loginParams.get('damaged') === '1') {
      const brand = loginParams.get('brand') || 'Phone';
      const memory = loginParams.get('memory') || '';
      const offer = Number(loginParams.get('offer') || 0).toLocaleString('en-IN');
      document.getElementById('loginDeviceName').textContent = `Damaged ${brand} ${memory}`;
      document.getElementById('loginPrice').textContent = `₹${offer}`;
      loginContinue.onclick = () => {
        const phone = loginPhone.value.replace(/\D/g, '');
        if (!/^\d{10}$/.test(phone)) { loginPhoneError.hidden = false; loginPhone.focus(); return; }
        loginPhoneError.hidden = true;
        sessionStorage.setItem('smartSwapCustomerPhone', phone);
        window.location.href = `done.html?damaged=1&brand=${encodeURIComponent(brand)}&memory=${encodeURIComponent(memory)}&offer=${encodeURIComponent(loginParams.get('offer') || '')}`;
      };
    }
  </script>
</body>
</html>
