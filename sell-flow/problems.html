<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do you have the following? | SmartSwap.Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="sell">
  <div id="site-header"></div>

  <main class="sell-flow-page">
    <section class="sell-flow-wrap wrap">
      <div class="sell-page-breadcrumb">Home &nbsp;&gt;&nbsp; Sell Old Mobile Phone &nbsp;&gt;&nbsp; Sell Old Xiaomi &nbsp;&gt;&nbsp; Phone issues</div>

      <div class="sell-main-panel" style="grid-template-columns:1.6fr .9fr;">
        <div class="sell-panel-left">
          <div id="problemPageTitle" class="sell-step-header">Functional or Physical Problems</div>
          <p class="sell-step-subtitle">Please choose appropriate condition to get accurate quote</p>

          <div id="problemChoiceList" class="problem-choice-grid"></div>

          <button id="problemContinueBtn" class="btn btn-coral btn-wide" type="button">Continue →</button>
        </div>

        <div class="sell-panel-right">
          <div class="device-card-selected">
            <div class="device-thumb-wrap">
              <img id="sellFlowSummaryImage" src="https://images.unsplash.com/photo-1573148195906-32dffe7b9d38?auto=format&fit=crop&w=500&q=80" alt="Phone" />
            </div>
            <div class="device-meta-text">
              <div id="problemSummaryName" class="device-name">Phone</div>
              <div id="problemSummaryPrice" class="device-price">₹0</div>
              <div class="device-seen">11860+ already sold on SmartSwap</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/firebase-auth.js"></script>
  <script src="../js/firebase-data.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/sell-flow.js"></script>
</body>
</html>
