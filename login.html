<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SWAPIO — Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><div id="site-header"></div><main class="section wrap"><section class="modal-box auth-page-box"><div class="eyebrow">Customer account</div><h2>Login to SWAPIO</h2><p class="section-note">Use your verified email and password to continue.</p><form id="loginPageForm" class="form-fields"><input name="email" type="email" placeholder="Email address" autocomplete="email" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn btn-coral" type="submit">Login</button><button class="btn btn-ghost" type="button" id="resendVerificationBtn" style="margin-top:10px;">Resend verification email</button><div class="form-msg"></div></form><div class="auth-links"><a href="register.html">Create account</a><a href="forgot-password.html">Forgot password?</a></div><p class="section-note" style="margin-top:12px;">If the verification email is not in your inbox, check your spam or junk folder.</p></section></main><div id="site-footer"></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/firebase-auth.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const form=document.getElementById('loginPageForm');const resendBtn=document.getElementById('resendVerificationBtn');const msg=form.querySelector('.form-msg');form.addEventListener('submit',async e=>{e.preventDefault();try{await swapioAuth.login(form.email.value.trim(),form.password.value);msg.textContent='Logged in.';msg.className='form-msg ok';location.href='index.html';}catch(error){msg.textContent=swapioAuth.messageForError(error);msg.className='form-msg err';}});resendBtn.addEventListener('click',async()=>{if(!form.email.value.trim()||!form.password.value){msg.textContent='Enter both email and password to resend the verification email.';msg.className='form-msg err';return;}try{await swapioAuth.resendVerificationEmail(form.email.value.trim(),form.password.value);msg.textContent='A new verification email has been sent. Please check your inbox and spam folder.';msg.className='form-msg ok';}catch(error){msg.textContent=swapioAuth.messageForError(error);msg.className='form-msg err';}});});</script></body></html>
