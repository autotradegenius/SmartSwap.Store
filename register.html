<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SWAPIO — Create Account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><div id="site-header"></div><main class="section wrap"><section class="modal-box auth-page-box"><div class="eyebrow">Customer account</div><h2>Create your account</h2><p class="section-note">We will email a verification link after registration. If it does not appear in your inbox, check your spam folder.</p><form id="registerForm" class="form-fields"><input name="email" type="email" placeholder="Email address" autocomplete="email" required><input name="password" type="password" placeholder="Password (6+ characters)" autocomplete="new-password" minlength="6" required><button class="btn btn-coral" type="submit">Create account</button><div class="form-msg"></div></form><div class="auth-links"><a href="login.html">Already have an account? Login</a></div></section></main><div id="site-footer"></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/firebase-auth.js"></script><script src="js/main.js"></script></body></html>
